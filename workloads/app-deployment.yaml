apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: demo-app
        image: nginx:alpine    # simple app for demo purposes
        env:
        - name: DB_PASSWORD    # inject the secret as an environment variable
          valueFrom:
            secretKeyRef:
              name: myapp-secret    # the Secret ESO created
              key: db_password
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: myapp-secret
              key: api_key
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"