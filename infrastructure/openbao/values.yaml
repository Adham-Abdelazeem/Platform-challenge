server:
  ha:
    enabled: true
    replicas: 3           # High Availability: 3 pods for redundancy
    raft:
      enabled: false      # We are using Postgres, so we turn off internal Raft storage
  
  storage:
    postgresql:
      # Change this to your actual Postgres service address!
      address: "postgres-ha-rw.postgres.svc.cluster.local:5432"
      database: "openbao"
      username: "openbao"
      password: "${OPENBAO_PG_PASSWORD}"
      sslmode: "require"

  extraEnvironmentVars:
    OPENBAO_PG_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: openbao-db-credentials
          key: password

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

ui:
  enabled: true
  serviceType: LoadBalancer