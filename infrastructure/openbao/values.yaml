server:
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: false

  # This 'config' block is the most reliable way to set storage
  config: |
    ui = true
    listener "tcp" {
      tls_disable = 1
      address     = "[::]:8200"
      cluster_address = "[::]:8201"
    }
    storage "postgresql" {
      connection_url = "postgres://openbao:${OPENBAO_PG_PASSWORD}@postgres-ha-rw.postgres.svc.cluster.local:5432/openbao?sslmode=require"
    }

  extraEnvironmentVars:
    OPENBAO_PG_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: openbao-db-credentials
          key: password

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

ui:
  enabled: true
  serviceType: LoadBalancer