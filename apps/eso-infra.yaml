apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Adham-Abdelazeem/Platform-challenge.git
    targetRevision: main
    path: infrastructure/eso
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true